<style>
.node{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;r:4}50%{opacity:1;r:6.5}}
.edge{stroke:#00C853;stroke-opacity:.18;stroke-width:1.2}
.sig{stroke:#00E676;stroke-width:2.2;stroke-dasharray:14 400;stroke-linecap:round;animation:flow 3s linear infinite;filter:url(#soft)}
@keyframes flow{from{stroke-dashoffset:414}to{stroke-dashoffset:0}}
.rv{animation:type 2.2s steps(40,end) .3s forwards}
@keyframes type{to{width:1200px}}
.rv2{animation:type 1.8s steps(48,end) 2.4s forwards}
.in1{animation:in 1.4s ease-out both}
.in2{animation:in 1.4s ease-out .9s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
.rain{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-320px)}to{transform:translateY(320px)}}
</style>
